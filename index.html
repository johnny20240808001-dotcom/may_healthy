<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>興華國際・保健諮詢</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--brand:#2E9090;--brand-dark:#237070;--bg:#F4F7F7;--card:#FFFFFF;--text:#2B3B3B;--muted:#7A8C8C;--red:#C0392B;--red-bg:#FDECEA;--yellow:#B7791F;--yellow-bg:#FDF6E3;--radius:14px}
.header{background:var(--brand)}.btn{background:var(--brand)}.btn:active{background:var(--brand-dark)}
.choice.on{border-color:var(--brand)}.choice.on .chk{background:var(--brand);border-color:var(--brand)}
.point{background:#EAF6F4}.point .tag{color:var(--brand)}.btn.ghost{color:var(--brand);border-color:var(--brand)}
.badge{background:var(--brand)}.prod.on-brand{border-color:var(--brand)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 90px}
.header{background:var(--brand);color:#fff;padding:14px 16px;border-radius:var(--radius);margin-bottom:14px}
.header h1{font-size:17px;font-weight:600}
.header p{font-size:12px;color:#D9F0EC;margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin-top:10px}
.btn:active{background:var(--brand-dark)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.gray{background:#E4EBEB;color:var(--muted)}
.btn:disabled{opacity:.45}
.choice{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid #DDE7E7;border-radius:12px;background:#fff;margin-bottom:9px;cursor:pointer;font-size:15px}
.choice.on{border-color:var(--brand);background:#EAF6F4;font-weight:600}
.choice .chk{width:20px;height:20px;border-radius:6px;border:2px solid #C4D4D4;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.choice.on .chk{background:var(--brand);border-color:var(--brand)}
.point{background:#EAF6F4;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.point .tag{font-size:12px;color:var(--brand);margin-bottom:4px}
.point .txt{font-size:15.5px;font-weight:600;line-height:1.6}
.body-text p{margin-bottom:11px;font-size:14.5px}
.acc-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid #DDE7E7;border-radius:12px;background:#fff;font-size:14px;cursor:pointer;color:var(--text)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease;font-size:13.5px;color:#4A5C5C}
.acc-body.open{max-height:1200px;padding-top:12px}
.acc-body p{margin-bottom:9px;white-space:pre-wrap}
.chev{transition:transform .3s}
.acc-btn.open .chev{transform:rotate(180deg)}
.prod{border:1.5px solid #E2EAEA;border-radius:12px;padding:13px;margin-bottom:11px;background:#fff}
.prod.yellow{border-color:#E8C983;background:var(--yellow-bg)}
.prod.red{border-color:#E5A199;background:var(--red-bg)}
.prod .pname{font-weight:600;font-size:15px}
.prod .ptopics{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand);color:#fff;margin-left:6px;vertical-align:middle}
.warn{margin-top:8px;font-size:13px;padding:9px 11px;border-radius:9px;line-height:1.6}
.warn.yellow{background:#FCF0D7;color:var(--yellow)}
.warn.red{background:#FADBD8;color:var(--red);font-weight:500}
.prod .btn{margin-top:10px;padding:10px;font-size:14px}
.prod .btn.consult{background:var(--red)}
.ing-item{padding:10px 0;border-bottom:1px solid #EEF3F3;font-size:14px}
.ing-item:last-child{border-bottom:none}
.ing-item .iname{font-weight:600}
.ing-item .imeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.disclaimer{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6;margin-top:14px}
.stepdots{text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px}
label{font-size:13.5px;color:var(--muted);display:block;margin:12px 0 5px}
textarea,input[type=text]{width:100%;padding:11px;border:1.5px solid #DDE7E7;border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
textarea{min-height:88px;resize:vertical}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2B3B3B;color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;max-width:88%}
.toast.show{opacity:1}
.hidden{display:none}
.loading{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .choice{margin-bottom:0;padding:12px 10px;font-size:14px;justify-content:flex-start}
.navrow{display:flex;gap:8px;margin-bottom:10px}
.navrow button{flex:1;padding:9px;border:1.5px solid #DDE7E7;border-radius:10px;background:#fff;color:var(--muted);font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 id="hdrTitle">保健諮詢</h1>
    <p id="hdrSub"></p>
  </div>
  <div id="app"><div class="loading">載入中…</div></div>
  <div class="disclaimer" id="disclaimer">以上為一般保健資訊,不能取代醫療診斷。</div>
</div>
<div id="toast" class="toast"></div>

<script>
var LIFF_ID = '2010599050-oxBrO2vr';
var API_URL = 'https://script.google.com/macros/s/AKfycbw6qUn6oObrU62ogooteExISBS0hgxLHqhXDCzNedIgMR4cO6Uvc0tPQ1e94PYJ5v2ywg/exec';
var CFG = {};
var S = {                 // 全域狀態
  profile: null,
  mode: 'nutrition',      // nutrition | consult
  init: null,             // {diseases, ingredients}
  picked: [],             // 選中的主題代碼
  medStatus: null,        // none | meds | anticoag | pregnant
  topics: [],             // 主題內容陣列
  topicIdx: 0,
  rec: null               // {ingredients, products}
};

/* ---------- 啟動 ---------- */
function applySettings() {
  if (CFG.brand_color) {
    document.documentElement.style.setProperty('--brand', CFG.brand_color);
    document.documentElement.style.setProperty('--brand-dark', shade(CFG.brand_color, -18));
  }
  document.getElementById('hdrTitle').textContent = (CFG.company_name || '') + '・保健諮詢';
  document.getElementById('hdrSub').textContent = CFG.header_subtitle || '';
  if (CFG.disclaimer) document.getElementById('disclaimer').innerHTML = esc(CFG.disclaimer).replace(/\n/g, '<br>');
}
function shade(hex, pct) {
  var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!m) return hex;
  var f = function (n) { return Math.max(0, Math.min(255, parseInt(n, 16) + Math.round(255 * pct / 100))); };
  var h = function (n) { return ('0' + n.toString(16)).slice(-2); };
  return '#' + h(f(m[1])) + h(f(m[2])) + h(f(m[3]));
}

window.addEventListener('load', function () {
  // 先抓系統設定(店名/藥師名/品牌色)
  call('apiGetSettings').then(function (st) {
    CFG = st || {};
    applySettings();
  }).catch(function () { applySettings(); });

  if (typeof liff === 'undefined') {
    render('<div class="card" style="color:#C0392B"><b>LIFF SDK 未載入</b><br>請檢查網路後重試</div>');
    return;
  }
  var done = false;
  setTimeout(function () {
    if (!done) {
      render('<div class="card" style="color:#C0392B"><b>初始化逾時</b><br>isInClient: ' + liff.isInClient() + '</div>');
    }
  }, 10000);
  liff.init({ liffId: LIFF_ID }).then(function () {
    done = true;
    if (!liff.isLoggedIn() && !liff.isInClient()) { liff.login(); return null; }
    return liff.getProfile();
  }).then(function (p) {
    if (p === null) return;
    if (p) S.profile = p;
    var q = new URLSearchParams(location.search);
    var st = q.get('liff.state');
    if (st) q = new URLSearchParams(st.replace(/^\?/, ''));
    S.mode = (q.get('type') === 'consult') ? 'consult' : 'nutrition';
    if (S.mode === 'consult') { renderConsult(); }
    else { loadInit(); }
  }).catch(function (err) {
    done = true;
    render('<div class="card" style="color:#C0392B"><b>初始化失敗</b><br>' +
      esc((err && err.message) ? err.message : String(err)) + '</div>');
  });
});

/* ---------- 資料呼叫(google.script.run 包裝) ---------- */
function call(fn, arg) {
  var u = API_URL + '?action=' + encodeURIComponent(fn);
  if (arg !== undefined) u += '&arg=' + encodeURIComponent(JSON.stringify(arg));
  return fetch(u).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.error) throw new Error(d.error);
    return d;
  });
}

/* ---------- 頁面:營養補充 - 第一層(疾病/成分) ---------- */
function loadInit() {
  render('<div class="loading">載入主題中…</div>');
  call('apiGetInit').then(function (d) {
    S.init = d;
    renderModePick();
  }).catch(function () { toast('載入失敗,請稍後再試'); });
}

function renderModePick() {
  var h = '<div class="card">';
  if (CFG.welcome_text) {
    h += '<p style="font-size:13.5px;color:var(--muted);margin-bottom:8px">' + esc(CFG.welcome_text) + '</p>';
  }
  h += '<b>您想了解哪一類?</b>' +
    '<button class="btn" onclick="renderTopicPick(\'disease\')">依健康困擾查詢(可複選)</button>' +
    '<button class="btn ghost" onclick="renderTopicPick(\'ingredient\')">直接查某個保健成分</button>' +
    '<button class="btn ghost" onclick="renderConsult()">💬 專人用藥諮詢</button></div>';
  render(h);
}

/* ---------- 頁面:主題選擇 ---------- */
function renderTopicPick(kind) {
  S.kind = kind;
  var list = kind === 'disease' ? S.init.diseases : S.init.ingredients;
  var multi = kind === 'disease';
  S.picked = [];
  var h = '<div class="card"><b>' + (multi ? '請勾選您的健康困擾(可複選)' : '請選擇想了解的成分') + '</b><div style="height:10px"></div>';
  h += '<div class="grid2">';
  list.forEach(function (t) {
    h += '<div class="choice" data-code="' + t.code + '" onclick="togglePick(this,' + multi + ')">' +
         '<div class="chk">✓</div><div>' + esc(t.name) + '</div></div>';
  });
  h += '</div>';
  h += '<button id="goBtn" class="btn" disabled onclick="afterPick(' + multi + ')">下一步</button>' +
       '<button class="btn gray" onclick="renderModePick()">← 回諮詢首頁</button></div>';
  render(h);
}

function togglePick(el, multi) {
  var code = el.getAttribute('data-code');
  if (!multi) {
    document.querySelectorAll('.choice').forEach(function (c) { c.classList.remove('on'); });
    S.picked = [code]; el.classList.add('on');
  } else {
    var i = S.picked.indexOf(code);
    if (i >= 0) { S.picked.splice(i, 1); el.classList.remove('on'); }
    else { S.picked.push(code); el.classList.add('on'); }
  }
  document.getElementById('goBtn').disabled = S.picked.length === 0;
}

function afterPick(multi) {
  if (multi) renderMedStatus();   // 疾病路:先問用藥狀態
  else loadTopics();              // 成分路:直接看內容
}

/* ---------- 頁面:用藥狀態(一次問,套用全部) ---------- */
function renderMedStatus() {
  S.medStatus = [];
  var opts = [
    ['none', '都沒有'],
    ['meds', '有服用慢性病藥物'],
    ['anticoag', '有服用抗凝血藥物(如可化凝、脈化寧、普栓達等)'],
    ['pregnant', '目前懷孕或備孕中']
  ];
  var h = '<div class="card"><b>為了給您安全的建議,請問您目前:(可複選)</b><div style="height:10px"></div>';
  opts.forEach(function (o) {
    h += '<div class="choice" data-v="' + o[0] + '" onclick="pickMed(this)"><div class="chk">✓</div><div>' + o[1] + '</div></div>';
  });
  h += '<button id="medBtn" class="btn" disabled onclick="loadTopics()">開始看說明</button>' +
       '<button class="btn gray" onclick="renderTopicPick(S.kind)">← 上一頁</button></div>';
  render(h);
}
function pickMed(el) {
  var v = el.getAttribute('data-v');
  if (v === 'none') {
    // 「都沒有」與其他互斥
    document.querySelectorAll('.choice').forEach(function (c) { c.classList.remove('on'); });
    S.medStatus = ['none']; el.classList.add('on');
  } else {
    // 取消「都沒有」
    var noneEl = document.querySelector('.choice[data-v="none"]');
    if (noneEl) noneEl.classList.remove('on');
    var i = S.medStatus.indexOf('none');
    if (i >= 0) S.medStatus.splice(i, 1);
    var j = S.medStatus.indexOf(v);
    if (j >= 0) { S.medStatus.splice(j, 1); el.classList.remove('on'); }
    else { S.medStatus.push(v); el.classList.add('on'); }
  }
  document.getElementById('medBtn').disabled = S.medStatus.length === 0;
}

/* ---------- 頁面:主題內容(逐一閱讀) ---------- */
function loadTopics() {
  render('<div class="loading">整理內容中…</div>');
  call('apiGetTopicDetails', S.picked).then(function (list) {
    S.topics = list; S.topicIdx = 0;
    if (!list.length) { toast('找不到主題內容'); renderModePick(); return; }
    renderTopic();
  }).catch(function () { toast('載入失敗'); });
}

function renderTopic() {
  var t = S.topics[S.topicIdx];
  var isLast = S.topicIdx === S.topics.length - 1;
  var h = '<div class="navrow"><button onclick="prevTopic()">← 上一頁</button><button onclick="renderModePick()">回諮詢首頁</button></div>';
  if (S.topics.length > 1) {
    h += '<div class="stepdots">' + (S.topicIdx + 1) + ' / ' + S.topics.length + ' 個主題</div>';
  }
  h += '<div class="card"><b style="font-size:16px">' + esc(t.name) + '</b><div style="height:10px"></div>';
  if (t.point) h += '<div class="point"><div class="tag">💡 重點</div><div class="txt">' + esc(t.point) + '</div></div>';
  h += '<div class="body-text">' + paras(t.body) + '</div>';
  if (t.deep && t.deep !== '(待填)') {
    h += '<button class="acc-btn" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.classList.toggle(\'open\')">' +
         '<span>🔍 深入了解</span><span class="chev">▾</span></button>' +
         '<div class="acc-body"><p>' + esc(t.deep) + '</p></div>';
  }
  if (S.kind === 'ingredient') {
    // 成分路:直接由藥師傳送推薦到 LINE,不在網頁顯示商品
    h += '<button class="btn" onclick="sendRecommendDirect()">' + esc(pharmTitle()) + '(傳送至 LINE)</button>' +
         '<p style="font-size:12px;color:var(--muted);text-align:center;margin-top:6px">商品資訊將直接傳送到您的 LINE 聊天室</p>';
  } else {
    h += '<button class="btn" onclick="nextTopic()">' + (isLast ? '看營養補充建議 →' : '下一個主題 →') + '</button>';
  }
  h += '</div>';
  render(h);
  window.scrollTo(0, 0);
}

function prevTopic() {
  if (S.topicIdx > 0) { S.topicIdx--; renderTopic(); }
  else if (S.kind === 'disease') { renderMedStatus(); }
  else { renderTopicPick(S.kind); }
}

function pharmTitle() {
  return CFG.recommend_title || '藥師專業推薦';
}

function sendRecommendDirect() {
  render('<div class="loading">為您準備藥師推薦中…</div>');
  call('apiGetRecommendations', S.picked).then(function (d) {
    S.rec = d;
    if (!d.products || !d.products.length) {
      toast('目前沒有對應的推薦商品,歡迎洽詢藥師');
      renderTopic();
      return;
    }
    pushCarousel();
  }).catch(function () { toast('載入失敗'); renderTopic(); });
}

function nextTopic() {
  if (S.topicIdx < S.topics.length - 1) { S.topicIdx++; renderTopic(); }
  else loadRecommendations();
}

/* ---------- 頁面:建議補充 + MAY 藥師推薦 ---------- */
function loadRecommendations() {
  render('<div class="loading">整理建議中…</div>');
  call('apiGetRecommendations', S.picked).then(function (d) {
    S.rec = d; renderRecommendations();
  }).catch(function () { toast('載入失敗'); });
}

function renderRecommendations() {
  var h = '<div class="navrow"><button onclick="S.topicIdx=S.topics.length-1;renderTopic()">← 上一頁</button><button onclick="renderModePick()">回諮詢首頁</button></div>';
  // 成分建議(衛教層):只顯示成分與說明,不含用法用量
  S.rec.ingredients.forEach(function (g) {
    h += '<div class="card"><b>' + esc(g.topicName) + '・建議補充方向</b><div style="height:6px"></div>';
    g.items.forEach(function (it) {
      h += '<div class="ing-item"><div class="iname">' + esc(it.name) + '</div>' +
           '<div>' + esc(it.reason) + '</div></div>';
    });
    h += '</div>';
  });

  // 商品不顯示於網頁;由客人主動請藥師傳送至 LINE
  h += '<div class="card"><b>需要 ' + esc(pharmTitle()) + ' 嗎?</b>' +
       '<p style="margin-top:6px;font-size:13.5px;color:var(--muted)">如需適合的產品建議,點下方按鈕,藥師推薦將直接傳送到您的 LINE 聊天室。</p>' +
       '<button class="btn" onclick="sendRecommendDirect2()">需要藥師建議產品(傳送至 LINE)</button>' +
       '</div>';
  render(h);
  window.scrollTo(0, 0);
}

function sendRecommendDirect2() {
  if (!S.rec || !S.rec.products || !S.rec.products.length) {
    toast('目前沒有對應的推薦商品,歡迎洽詢藥師');
    return;
  }
  pushCarousel();
}

/* ---------- 推薦 carousel 推回 LINE ---------- */
function pushCarousel() {
  if (!liff.isInClient()) { toast('請從 LINE 內開啟才能傳送'); return; }
  var items = S.rec.products.slice(0, 12); // carousel 上限 12
  var bubbles = items.map(function (p) {
    var isRed = p.warnLevel === '紅';
    var bodyContents = [
      { type: 'text', text: p.name, weight: 'bold', size: 'md', wrap: true }
    ];
    if (p.topics.length) bodyContents.push({ type: 'text', text: '適用:' + p.topics.join('、'), size: 'xs', color: '#888888', wrap: true });
    if (p.warnText) bodyContents.push({ type: 'text', text: '⚠ ' + p.warnText, size: 'xxs', color: isRed ? '#C0392B' : '#B7791F', wrap: true });
    bodyContents.push({ type: 'text', text: '保健食品不能取代藥物,如有用藥請諮詢藥師', size: 'xxs', color: '#AAAAAA', wrap: true });
    var footerBtn = isRed || !p.link
      ? { type: 'button', style: 'primary', color: '#C0392B', action: { type: 'message', label: '諮詢藥師', text: '我想諮詢藥師關於:' + p.name } }
      : { type: 'button', style: 'primary', color: '#2E9090', action: { type: 'uri', label: '立即購買', uri: p.link } };
    var bubble = {
      type: 'bubble', size: 'kilo',
      body: { type: 'box', layout: 'vertical', spacing: 'sm', contents: bodyContents },
      footer: { type: 'box', layout: 'vertical', contents: [footerBtn] }
    };
    if (p.img) bubble.hero = { type: 'image', url: p.img, size: 'full', aspectRatio: '1:1', aspectMode: 'cover' };
    return bubble;
  });
  liff.sendMessages([{
    type: 'flex',
    altText: (CFG.recommend_title || '藥師推薦') + '・為您推薦的保健品',
    contents: { type: 'carousel', contents: bubbles }
  }]).then(function () {
    liff.closeWindow();
  }).catch(function () {
    toast('傳送失敗,請確認由 LINE 開啟後再試');
  });
}

/* ---------- 頁面:用藥諮詢(轉真人,零 AI) ---------- */
function renderConsult(prefill) {
  var h = '<div class="card"><b>💬 專人用藥諮詢</b>' +
    '<p style="font-size:13px;color:var(--muted);margin-top:4px">由藥師本人回覆,您填的內容只會交給藥師,系統不做任何分析。</p>' +
    '<label>目前服用的藥品(可看藥袋填寫)</label>' +
    '<textarea id="cMeds" placeholder="例:脈化寧、降血壓藥"></textarea>' +
    '<label>想諮詢的問題</label>' +
    '<textarea id="cQ" placeholder="例:想吃魚油保養,可以嗎?">' + (prefill ? '我想諮詢關於:' + esc(prefill) : '') + '</textarea>' +
    '<label>希望的聯絡方式(選填)</label>' +
    '<input type="text" id="cContact" placeholder="LINE 回覆即可 / 或留電話">' +
    '<button class="btn" id="cSend" onclick="submitConsult()">送出給藥師</button>' +
    (S.mode === 'nutrition' ? '<button class="btn gray" onclick="renderModePick()">← 返回諮詢</button>' : '') +
    '</div>';
  render(h);
  window.scrollTo(0, 0);
}

function submitConsult() {
  var q = document.getElementById('cQ').value.trim();
  if (!q) { toast('請填寫想諮詢的問題'); return; }
  var btn = document.getElementById('cSend');
  btn.disabled = true; btn.textContent = '送出中…';
  call('apiSubmitConsult', {
    userId: S.profile ? S.profile.userId : '',
    displayName: S.profile ? S.profile.displayName : '',
    meds: document.getElementById('cMeds').value.trim(),
    question: q,
    contact: document.getElementById('cContact').value.trim()
  }).then(function (r) {
    if (r && r.ok) {
      var note = esc(CFG.consult_reply_note || '藥師會在營業時間內回覆您。').replace(/\n/g, '<br>');
      if (CFG.contact_phone) note += '<br>電話:' + esc(CFG.contact_phone);
      render('<div class="card" style="text-align:center;padding:30px 16px">' +
        '<div style="font-size:40px">✅</div><b style="font-size:16px">已收到您的諮詢</b>' +
        '<p style="font-size:14px;color:var(--muted);margin-top:8px">' + note + '</p>' +
        '<button class="btn" onclick="liff.closeWindow()">關閉</button></div>');
    } else {
      toast((r && r.msg) || '送出失敗,請再試一次');
      btn.disabled = false; btn.textContent = '送出給藥師';
    }
  }).catch(function () {
    toast('送出失敗,請再試一次');
    btn.disabled = false; btn.textContent = '送出給藥師';
  });
}

/* ---------- 工具 ---------- */
function render(html) { document.getElementById('app').innerHTML = html; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function paras(s) {
  return String(s || '').split(/\n{2,}/).map(function (p) {
    return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
}
</script>
